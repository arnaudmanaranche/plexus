<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plexus — package.json analysis</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            plexus: {
              bg: '#0f1117',
              surface: '#1a1d27',
              border: '#2e3248',
              code: '#22263a',
            },
          },
        },
      },
    };
  </script>
</head>
<body class="box-border min-h-screen bg-plexus-bg text-slate-200 font-sans text-[15px] leading-relaxed antialiased px-6 py-8 pb-12">
  <div class="max-w-[520px] mx-auto">
    <h1 class="text-xl font-bold text-cyan-400 mb-2">Plexus</h1>
    <p class="text-slate-500 mb-5">
      Upload a <code class="text-xs bg-plexus-code px-1.5 py-0.5 rounded text-slate-300 font-mono">package.json</code>
      for the same report as the CLI: versions are resolved from the npm registry (no local
      <code class="text-xs bg-plexus-code px-1.5 py-0.5 rounded text-slate-300 font-mono">node_modules</code>).
    </p>
    <div class="bg-plexus-surface border border-plexus-border rounded-xl p-5">
      <label class="block border border-dashed border-plexus-border rounded-lg py-6 px-4 text-center cursor-pointer text-slate-500 transition-colors duration-150 hover:border-cyan-400 hover:text-slate-200">
        <input type="file" id="file" class="hidden" accept=".json,application/json">
        <span id="fileLabel">Choose a file…</span>
      </label>
      <div class="mt-4 flex flex-col gap-2.5">
        <label class="flex items-center gap-2 cursor-pointer text-slate-500 text-sm select-none">
          <input type="checkbox" id="optFix" class="rounded border-plexus-border bg-plexus-surface text-cyan-500 focus:ring-cyan-500 focus:ring-offset-0 focus:ring-offset-plexus-bg">
          Include <code class="text-xs bg-plexus-code px-1.5 py-0.5 rounded font-mono text-slate-400">--fix</code> resolution plan (extra npm requests)
        </label>
        <label class="flex items-center gap-2 cursor-pointer text-slate-500 text-sm select-none">
          <input type="checkbox" id="optBundle" class="rounded border-plexus-border bg-plexus-surface text-cyan-500 focus:ring-cyan-500 focus:ring-offset-0 focus:ring-offset-plexus-bg">
          BundlePhobia sizes (slower)
        </label>
      </div>
      <button type="button" id="run" disabled
        class="mt-4 w-full py-3 px-4 rounded-lg bg-cyan-700 hover:bg-cyan-600 disabled:hover:bg-cyan-700 text-white font-semibold text-[15px] cursor-pointer disabled:opacity-50 disabled:cursor-not-allowed transition-colors">
        Generate report
      </button>
      <div id="err" class="hidden mt-3 px-3 py-2.5 bg-red-950/80 border border-red-900 rounded-lg text-red-200 text-sm"></div>
      <p class="mt-3.5 text-xs text-slate-500">
        CLI equivalent:
        <code class="text-xs bg-plexus-code px-1.5 py-0.5 rounded font-mono text-slate-400">npx plexus --html</code>
        from your project root (uses
        <code class="text-xs bg-plexus-code px-1.5 py-0.5 rounded font-mono text-slate-400">node_modules</code>
        for disk sizes and transitive peer versions).
      </p>
    </div>
  </div>
  <script>
    (function () {
      var fileInput = document.getElementById('file');
      var fileLabel = document.getElementById('fileLabel');
      var runBtn = document.getElementById('run');
      var errEl = document.getElementById('err');
      var optFix = document.getElementById('optFix');
      var optBundle = document.getElementById('optBundle');
      var parsed = null;

      function showErr(msg) {
        errEl.textContent = msg;
        errEl.classList.remove('hidden');
      }
      function clearErr() {
        errEl.classList.add('hidden');
      }

      fileInput.addEventListener('change', function () {
        clearErr();
        parsed = null;
        runBtn.disabled = true;
        var f = fileInput.files && fileInput.files[0];
        if (!f) {
          fileLabel.textContent = 'Choose a file…';
          return;
        }
        fileLabel.textContent = f.name;
        var reader = new FileReader();
        reader.onload = function () {
          try {
            parsed = JSON.parse(reader.result);
            if (typeof parsed !== 'object' || parsed === null || Array.isArray(parsed)) {
              throw new Error('JSON must be a package.json object.');
            }
            runBtn.disabled = false;
          } catch (e) {
            showErr(e.message || 'Invalid JSON.');
          }
        };
        reader.readAsText(f, 'UTF-8');
      });

      runBtn.addEventListener('click', function () {
        if (!parsed) return;
        clearErr();
        runBtn.disabled = true;
        runBtn.textContent = 'Analyzing…';
        fetch('/api/analyze', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            packageJson: parsed,
            fix: optFix.checked,
            bundleSize: optBundle.checked,
          }),
        })
          .then(function (res) {
            if (!res.ok) {
              var ct = res.headers.get('content-type') || '';
              if (ct.indexOf('application/json') !== -1) {
                return res.json().then(function (j) {
                  throw new Error(j.error || res.statusText);
                });
              }
              return res.text().then(function (t) {
                throw new Error(t.slice(0, 200) || res.statusText);
              });
            }
            return res.text();
          })
          .then(function (html) {
            var w = window.open('', '_blank');
            if (w) {
              w.document.write(html);
              w.document.close();
            } else {
              var blob = new Blob([html], { type: 'text/html' });
              var url = URL.createObjectURL(blob);
              window.location.href = url;
            }
          })
          .catch(function (e) {
            showErr(e.message || String(e));
          })
          .finally(function () {
            runBtn.disabled = false;
            runBtn.textContent = 'Generate report';
          });
      });
    })();
  </script>
</body>
</html>
